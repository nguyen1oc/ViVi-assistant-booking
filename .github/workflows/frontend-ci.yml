name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'internal-portal/frontend/**'
      - '.github/workflows/frontend-ci.yml'
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - 'internal-portal/frontend/**'
      - '.github/workflows/frontend-ci.yml'
    branches: [testing, develop, main]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-customer-app:
    name: Build Customer App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build check
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
          VITE_MEDIA_BASE_URL: https://media.example.invalid
        run: npm run build

  build-internal-portal:
    name: Build Internal Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal-portal/frontend/package-lock.json

      - name: Install dependencies
        working-directory: internal-portal/frontend
        run: npm ci

      - name: Build check
        working-directory: internal-portal/frontend
        env:
          VITE_INTERNAL_API_BASE_URL: https://api.example.invalid/api/v1/internal
        run: npm run build

